<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Landing Gabi</title>

<!-- Fonte do rascunho -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: #121212; /* fundo igual rascunho */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 420px;
    max-width: 95%;
    text-align: center;
    padding: 40px 30px;
    background: #1c1c1c; /* container igual rascunho */
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.7);
}

h1 {
    margin-bottom: 12px;
    font-size: 30px;
    font-weight: 700;
    color: #f2f2f2;
}

p {
    margin-bottom: 22px;
    color: #cccccc;
    font-size: 15px;
}

input,
textarea {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    background: #2a2a2a;
    color: #fff;
    transition: 0.3s;
}

input::placeholder,
textarea::placeholder {
    color: #888;
}

input:focus,
textarea:focus {
    outline: 2px solid #a855f7; /* foco igual rascunho */
}

textarea {
    height: 90px;
    resize: none;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

.enviar {
    background: #a855f7;
    color: #fff;
}
.enviar:hover {
    background: #9333ea;
}

.whatsapp {
    background: #25d366;
    color: #fff;
}
.whatsapp:hover {
    background: #1ebe5d;
}

.instagram {
    background: #e1306c;
    color: #fff;
}
.instagram:hover {
    background: #c1275b;
}

.links {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

#msg {
    margin-top: 18px;
    font-weight: 700;
    color: #00ff99;
}
</style>
</head>

<body>

<div class="container">

<h1>Fale com a Gabi!</h1>

<p>Preencha o formulário abaixo e entraremos em contato rapidamente.</p>

<form id="form">
    <input id="campoA" placeholder="Nome completo" required>
    <input id="campoB" placeholder="E-mail" required>
    <input id="campoC" placeholder="Telefone">
    <textarea id="campoD" placeholder="Sua mensagem"></textarea>
    <button class="enviar" type="submit">Enviar</button>
</form>

<div class="links">
    <button class="whatsapp" onclick="window.open('https://wa.me/5519981351382')">WhatsApp</button>
    <button class="instagram" onclick="window.open('https://www.instagram.com/almaelua.store/')">Instagram</button>
</div>

<p id="msg"></p>

</div>

<script src="script.js"></script>

</body>
</html>
