<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Aterrissando da Gabi</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg,#2c1a47,#5a2b83,#1b0c30);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      width: 380px;
      padding: 40px;
      border-radius: 16px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    h1 {
      margin-bottom: 25px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }

    textarea {
      resize: none;
      height: 90px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #a855f7;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #9333ea;
      transform: scale(1.02);
    }

    #msg {
      margin-top: 15px;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Aterrissando da Gabi</h1>

    <form id="form">

      <input id="campoA" type="text" placeholder="Seu nome" required>

      <input id="campoB" type="email" placeholder="Seu email" required>

      <input id="campoC" type="text" placeholder="Telefone">

      <textarea id="campoD" placeholder="O que você busca entender ou resolver?"></textarea>

      <button type="submit">Enviar</button>

    </form>

    <p id="msg"></p>

  </div>

  <script src="script.js"></script>

</body>
</html>
