<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Converse com a Gabi!</title>

<!-- Fonte igual ao rascunho -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', Arial, Helvetica, sans-serif;
    background: #f8f9fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 400px;
    max-width: 95%;
    text-align: center;
    padding: 40px 30px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
}

h1 {
    margin-bottom: 15px;
    font-size: 28px;
    font-weight: 600;
    color: #1e0b3a;
}

p {
    margin-bottom: 25px;
    color: #555;
    font-size: 15px;
}

input,
textarea {
    width: 100%;
    padding: 12px 15px;
    margin-top: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: 0.3s;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #a855f7;
}

textarea {
    height: 100px;
    resize: none;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

/* Enviar */
.enviar {
    background: #a855f7;
    color: white;
}
.enviar:hover {
    background: #9333ea;
}

/* WhatsApp */
.whatsapp {
    background: #25D366;
    color: white;
}
.whatsapp:hover {
    background: #1ebe5d;
}

/* Instagram */
.instagram {
    background: #E1306C;
    color: white;
}
.instagram:hover {
    background: #c1275b;
}

.links {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

#msg {
    margin-top: 20px;
    color: #28a745;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="container">

<h1>Converse com a Gabi!</h1>

<p>Preencha o formulário e entraremos em contato rapidamente.</p>

<form id="form">
    <input id="campoA" placeholder="Seu nome" required>
    <input id="campoB" placeholder="Seu e-mail" required>
    <input id="campoC" placeholder="Telefone">
    <textarea id="campoD" placeholder="Como podemos ajudar você?"></textarea>
    <button class="enviar" type="submit">Enviar</button>
</form>

<div class="links">
    <button class="whatsapp" onclick="window.open('https://wa.me/5519981351382')">
        Falar no WhatsApp
    </button>
    <button class="instagram" onclick="window.open('https://www.instagram.com/almaelua.store/')">
        Instagram da Loja
    </button>
</div>

<p id="msg"></p>

</div>

<script src="script.js"></script>
</body>
</html>
