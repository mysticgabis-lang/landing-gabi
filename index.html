<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Aterrissando da Gabi</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#1e0b3a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:420px;
text-align:center;
padding:40px;
background:rgba(0,0,0,0.35);
border-radius:18px;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

h1{
margin-bottom:10px;
font-size:32px;
}

p{
margin-bottom:20px;
color:#ddd;
}

input, textarea{

width:100%;
padding:12px;
margin-top:12px;
border-radius:8px;
border:none;
font-size:14px;

}

textarea{
height:90px;
resize:none;
}

button{

width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;

}

.enviar{
background:#a855f7;
color:white;
}

.enviar:hover{
background:#9333ea;
}

.whatsapp{
background:#25D366;
color:white;
}

.instagram{
background:#E1306C;
color:white;
}

.links{
margin-top:20px;
display:flex;
flex-direction:column;
gap:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>Aterrissando da Gabi</h1>

<p>Deixe sua mensagem e entraremos em contato.</p>

<form id="form">

<input id="campoA" placeholder="Seu nome" required>

<input id="campoB" placeholder="Seu email" required>

<input id="campoC" placeholder="Telefone">

<textarea id="campoD" placeholder="O que você busca entender ou resolver?"></textarea>

<button class="enviar" type="submit">Enviar</button>

</form>

<div class="links">

<button class="whatsapp"
onclick="window.open('https://wa.me/5519981351382')">
Falar no WhatsApp
</button>

<button class="instagram"
onclick="window.open('https://www.instagram.com/almaelua.store/')">
Instagram da Loja
</button>

</div>

<p id="msg"></p>

</div>

<script src="script.js"></script>

</body>
</html>
